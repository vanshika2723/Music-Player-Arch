
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melody - Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h2>♫ Melody</h2>
      <p class="muted">YOUR MUSIC</p>
      <button class="nav active" data-filter="All">⌂ Discover</button>
      <button class="nav" data-filter="Pop">♫ Pop Music</button>
      <button class="nav" data-filter="Chill">☁ Chill Vibes</button>
      <button class="nav" data-filter="Electronic">⚡ Electronic</button>
      <div class="side-bottom">
        <p class="muted">NOW PLAYING</p>
        <p id="sideSong">Choose a song</p>
      </div>
    </aside>

    <main>
      <header>
        <div>
          <p class="muted">YOUR PERSONAL MUSIC SPACE</p>
          <h1>Discover Music</h1>
        </div>
        <input id="search" type="search"
          placeholder="Search songs or artists..." aria-label="Search music">
      </header>

      <section class="hero">
        <div>
          <span class="tag">YOUR DAILY MIX</span>
          <h2>Feel every<br>beat.</h2>
          <p>Your music. Your mood. Your moment.</p>
          <button id="heroPlay" class="primary">▶ Play music</button>
        </div>
        <div class="hero-note">♫</div>
      </section>

      <section>
        <div class="section-title">
          <h2>Made for you</h2>
          <span id="songCount">0 tracks</span>
        </div>
        <div id="musicGrid" class="music-grid"></div>
      </section>

      <section>
        <h2>Your Playlist</h2>
        <div id="playlist" class="playlist"></div>
      </section>
    </main>
  </div>

  <footer class="player">
    <div class="track-info">
      <div id="miniCover" class="mini-cover">♫</div>
      <div>
        <strong id="currentTitle">Select a song</strong>
        <p id="currentArtist">Melody Player</p>
      </div>
    </div>

    <div class="controls">
      <div class="buttons">
        <button id="prev" aria-label="Previous song">⏮</button>
        <button id="play" class="play-button" aria-label="Play or pause">▶</button>
        <button id="next" aria-label="Next song">⏭</button>
      </div>
      <div class="progress-row">
        <span id="elapsed">0:00</span>
        <input id="progress" type="range" min="0" max="100"
          value="0" aria-label="Song progress">
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="volume">
      <span>🔊</span>
      <input id="volume" type="range" min="0" max="1" step="0.01"
        value="0.7" aria-label="Volume">
    </div>
  </footer>

  <audio id="audio"></audio>
  <script src="script.js"></script>
</body>
</html>
